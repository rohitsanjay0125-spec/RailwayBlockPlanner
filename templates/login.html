<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Railway Block Planner - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            text-align: center;
            color: #17202a;
        }

        input,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #17202a;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #34495e;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="card">

            <h1>🚆 Railway Block Planner</h1>

            <h2>Login</h2>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">

                <input
                    type="text"
                    name="user_id"
                    placeholder="User ID"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <select name="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                    <option value="Engineering">
                        Engineering
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                    <option value="Admin">
                        Admin
                    </option>

                </select>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
